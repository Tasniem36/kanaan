server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API → the api container. Never let the browser cache API responses, or a
  # reload shows stale data before the fresh response lands.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  # Product images live in the api container's media volume, served at /media.
  # Filenames are content-hashed, so cache them hard.
  location /media/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Content-hashed build assets (index-<hash>.js, etc.) never change for a given
  # name → cache them hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Prerendered pages + SPA history-mode fallback. Prefer a prerendered file
  # ($uri.html, e.g. /login → login.html) before falling back to the SPA shell, so
  # crawlers and first paint get real HTML. All HTML is revalidated so a new deploy
  # (with new asset hashes) is picked up on the very next load, not served stale.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
