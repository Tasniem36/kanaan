server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API → the api container. Never let the browser cache API responses, or a
  # reload shows stale data before the fresh response lands.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  # Content-hashed build assets (index-<hash>.js, etc.) never change for a given
  # name → cache them hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA entry + history-mode fallback. index.html must always be revalidated so a
  # new deploy (with new asset hashes) is picked up on the very next load instead
  # of serving the old app from cache.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
