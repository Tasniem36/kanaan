server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API → the api container. Never let the browser cache API responses, or a
  # reload shows stale data before the fresh response lands.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  # Product images live in the api container's media volume, served at /media.
  # Filenames are content-hashed, so cache them hard.
  location /media/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # sitemap.xml is generated from the live catalogue by the API, so it can't be a
  # static file in the build. Crawlers look for it at the root, hence the rewrite.
  location = /sitemap.xml {
    proxy_pass http://api:8080/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Content-hashed build assets (index-<hash>.js, etc.) never change for a given
  # name → cache them hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Prerendered pages + SPA history-mode fallback. Prefer a prerendered file
  # ($uri.html, e.g. /login → login.html); for everything else fall back to the
  # empty SPA shell (app.html) — NOT index.html, which is the prerendered home and
  # would flash the home page before the router swaps in the real view. The home
  # page itself is still served prerendered: "/" resolves to index.html via `index`.
  # All HTML is revalidated so a new deploy (new asset hashes) is picked up next load.
  location / {
    try_files $uri $uri.html $uri/ /app.html;
    add_header Cache-Control "no-cache";
  }
}
