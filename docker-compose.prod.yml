# Production stack: Postgres + API + web (nginx) + Caddy (HTTPS at your domain).
# Deploy:  docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ENV: production
      CORS_ORIGIN: https://${DOMAIN}
      PORT: 8080
      SEED_MANAGER_EMAIL: ${SEED_MANAGER_EMAIL:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-}
      WHATSAPP_APIKEY: ${WHATSAPP_APIKEY:-}
      # Signup verification — email code (SMTP / Gmail app password)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Signup verification — phone code (Twilio SMS)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      # Web Push device notifications (VAPID)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # WhatsApp updates to the CUSTOMER (Meta Cloud API). Distinct from the
      # WHATSAPP_PHONE/APIKEY pair above, which messages the shop's own managers:
      # this is the only channel that reaches a guest, who has no account and may
      # have given no e-mail. Without these listed here the container never sees
      # them, however carefully they are set in .env, and nothing is ever sent.
      WA_CLOUD_TOKEN: ${WA_CLOUD_TOKEN:-}
      WA_CLOUD_PHONE_ID: ${WA_CLOUD_PHONE_ID:-}
      WA_TEMPLATE_PLACED: ${WA_TEMPLATE_PLACED:-}
      WA_TEMPLATE_STATUS: ${WA_TEMPLATE_STATUS:-}
      WA_TEMPLATE_LANG: ${WA_TEMPLATE_LANG:-}
      WA_NOTIFY_ALL: ${WA_NOTIFY_ALL:-}
      # Ziina online payments (optional)
      ZIINA_API_KEY: ${ZIINA_API_KEY:-}
      ZIINA_TEST: ${ZIINA_TEST:-false}
      APP_URL: https://${DOMAIN}
      MEDIA_DIR: /app/media
      # Tuning, all optional — each falls back to its own default when left empty.
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      PAYMENT_STALE_MINUTES: ${PAYMENT_STALE_MINUTES:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
    volumes:
      - media:/app/media   # persisted product images (served at /media)
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python migrate.py && uvicorn main:app --host 0.0.0.0 --port 8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  dbdata:
  media:
  caddy_data:
  caddy_config:
